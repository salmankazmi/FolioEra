name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Prepare Environment
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install --no-package-lock

      - name: Ensure Web Distribution Exists
        run: |
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            cat << 'EOF' > dist/index.html
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>FolioEra Premium</title>
              <meta name="theme-color" content="#1C1917" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
              <script type="module" crossorigin src="/assets/index.js"></script>
              <link rel="stylesheet" crossorigin href="/assets/index.css">
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
          fi

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap sync android

          # Ensure capacitor.settings.gradle is present
          if [ ! -f "android/capacitor.settings.gradle" ]; then
            cat << 'EOF' > android/capacitor.settings.gradle
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File(rootDir, '../node_modules/@capacitor/android/capacitor')
          EOF
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolioEra-Premium-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
